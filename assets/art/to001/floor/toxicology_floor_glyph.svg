<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64" role="img" aria-label="Toxicology laboratory floor glyph">
  <title>Toxicology Laboratory — Floor Selection Glyph</title>
  <desc>Original flat-white laboratory floor-mark icon. Transparent background; no native or addon atlas art. Separate from the 64 px room-menu glyph.</desc>
  <!-- The glyph is drafted in the actual 128 x 64 isometric floor tile. No red/gray panels. -->
  <!-- A single custom flared chemistry vessel, visually separate from vanilla paired test tubes. -->
  <g fill="none" stroke="#F2F2F2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52.6 12.6 L65.2 10.4" stroke-width="2.5"/>
    <path d="M55.8 12.1 L57.9 21.4 L43.8 39.7 Q41.4 43.2 46.6 45.4 L67.2 50.0 Q72.6 50.6 71.2 46.6 L64.5 25.4 L62.4 11.2" stroke-width="3.4"/>
    <path d="M47.8 38.1 Q55.8 37.2 62.3 40.3 Q66.9 42.4 69.5 42.7" stroke-width="2.05"/>
    <path d="M51.2 44.5 L67.3 47.7" stroke-width="1.05" opacity=".68"/>
    <path d="M54.2 31.7 L59.3 28.9 L66.0 32.8" stroke-width="1.65"/>
  </g>
  <!-- The small connected points describe analytical chemistry rather than a generic flask. -->
  <g fill="#F2F2F2">
    <circle cx="53.7" cy="31.9" r="1.90"/>
    <circle cx="59.2" cy="28.9" r="2.25"/>
    <circle cx="66.0" cy="32.9" r="1.78"/>
    <circle cx="60.4" cy="42.4" r="1.18"/>
  </g>
  <!-- A compact supporting instrument sensor adds distinct floor-icon identity. -->
  <path d="M75.2 31.1 L85.6 34.0 L82.6 42.0 L73.1 39.4 Z" fill="none" stroke="#F2F2F2" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M76.5 34.4 L81.5 35.6" stroke="#F2F2F2" stroke-width="1.75" stroke-linecap="round"/>
</svg>
