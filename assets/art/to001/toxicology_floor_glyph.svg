<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128" role="img" aria-label="Toxicology Laboratory floor zone symbol">
  <title>Toxicology floor glyph: oblique analytical flask</title>
  <desc>Original purpose-authored isometric floor stencil using the same flask silhouette as the room menu, with altered footprint, oblique rim, and projected liquid line. No zone color, base square, or background.</desc>
  <!-- Native zoning glyphs are near-white stencil shapes on transparent floor tiles. -->
  <g stroke="#F2F2F2" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Angled neck and flared flask body, redrawn specifically for a 256 x 128 tile. -->
    <path d="M95 25 L113 14 L139 24 L120 36 M101 29 L109 46 Q110 49 106 55 L66 82 Q60 87 70 93 L119 116 Q129 121 138 116 L191 91 Q198 87 187 82 L142 57 Q134 52 131 48 L123 34" stroke-width="5.2"/>
    <!-- A shallow near-glass inner fluid wave following the oblique vessel. -->
    <path d="M78 84 Q92 81 104 87 L132 100 Q142 103 151 100 L179 86" stroke-width="3.15"/>
    <!-- Atom/sensor pattern is integrated inside the fluid chamber, not a separate badge. -->
    <path d="M104 79 L122 68 L143 81" stroke-width="2.8"/>
  </g>
  <g fill="#F2F2F2">
    <ellipse cx="102.4" cy="79.2" rx="3.55" ry="2.75"/>
    <ellipse cx="121.4" cy="67.7" rx="4.0" ry="3.0"/>
    <ellipse cx="143.0" cy="81.1" rx="3.55" ry="2.75"/>
  </g>
</svg>
