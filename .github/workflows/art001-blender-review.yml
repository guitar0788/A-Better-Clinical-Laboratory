name: ART-001 Blender Real 3D Source Preview (NOT INSTALLABLE)

on:
  push:
    branches:
      - feature/art-001-two-devices
    paths:
      - "tools/art001_blender_render.py"
      - ".github/workflows/art001-blender-review.yml"
  pull_request:
    paths:
      - "tools/art001_blender_render.py"
      - ".github/workflows/art001-blender-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-3d-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source syntax before installing Blender
        run: python -m py_compile tools/art001_blender_render.py
      - name: Install official pinned Blender bpy wheel and Pillow (cloud only)
        run: python -m pip install --disable-pip-version-check "bpy==4.5.15" "Pillow==12.3.0"
      - name: Generate editable Blender scene and eight transparent orthographic images
        run: python tools/art001_blender_render.py --output "$GITHUB_WORKSPACE/art001-blender-preview"
      - name: Verify exact source-only inventory and native image bounds
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path("art001-blender-preview")
          m=json.loads((root/"art_manifest.json").read_text())
          assert m["source_only"] and m["not_installable"] and not m["l4_tested"]
          assert m["white_palette"]["body"]=="#e6e6e6"
          assert m["directions"]==["NW","NE","SE","SW"]
          assert len(m["bounds"])==8 and len(m["sha256"])==10
          sprites=list((root/"Native128").glob("*.png"))
          assert len(sprites)==8
          for p in sprites:
              with Image.open(p) as im:
                  assert im.mode=="RGBA" and im.size==(128,128) and im.getchannel("A").getbbox()
          for filename,digest in m["sha256"].items():
              matches=list(root.rglob(filename))
              assert len(matches)==1 and hashlib.sha256(matches[0].read_bytes()).hexdigest()==digest
          assert (root/"Sources"/"ART001_original_editable_3D.blend").stat().st_size > 1024
          assert not list(root.rglob("*.dll")) and not list(root.rglob("*.aes"))
          print("PASS: editable Blender scene, eight independent 128x128 art previews, no installable binaries")
          PY
      - name: Upload original 3D source and preview ONLY
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-BLENDER-V1-SOURCE-REVIEW-ONLY
          path: art001-blender-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Explain scope and acceptance
        if: always()
        run: |
          echo "### FA Blender original-equipment study" >> "$GITHUB_STEP_SUMMARY"
          echo "In Artifacts open **Previews/ART001_Blender_review.png**. The **Sources/ART001_original_editable_3D.blend** source is editable." >> "$GITHUB_STEP_SUMMARY"
          echo "CI is offline source evidence only: no native game textures, no GameDB atlas replacement, no G1 edits, no installer, no approved visual design or L4." >> "$GITHUB_STEP_SUMMARY"
