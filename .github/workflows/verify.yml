name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository policies and tracked source data
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Print scope of this check
        run: |
          echo "Verify covers repository rules and XML syntax only."
          echo "No game-assembly compilation (L3) or Project Hospital runtime (L4) was performed."


  g2_toxicology_source_gate:
    name: G2 three toxicology assays / two new cases / original game noninterference (L2 ONLY)
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-g2-vanilla-medical-icons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: 851b3059bed871d38844cffff7310de995bb2019
          path: _frozen_G1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run G2 native clinical positive and negative contracts
        run: python -m unittest discover -s tests -p 'test_g2_clinical_native_contract.py' -v
      - name: Generate exact original flat-white disease icon PNGs in native 64px / 32px
        run: |
          python -m pip install "CairoSVG==2.8.2" "Pillow==12.3.0"
          python -m unittest discover -s tests -p 'test_g2_vanilla_medical_icon_contract.py' -v
          python tools/render_g2_vanilla_disease_icons_v2.py --out _output/g2_icons
      - name: Produce deterministic clinically bound GameDB candidate, no original assets
        run: |
          python tools/build_g2_clinical_overlay.py \
            --g1 _frozen_G1/assets/g1/Database --output _output/g2 --icons _output/g2_icons
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json,hashlib
          root=Path('_output/g2')
          files=list(root.glob('*.xml'))
          assert len(files)==8
          assert not list(root.glob('*.dll'))
          assert len(ET.parse(root/'ModDiagnosesG2.xml').getroot())==2
          assert len(ET.parse(root/'ModSymptomsG2.xml').getroot())==2
          assert len(ET.parse(root/'ModExaminationsG2.xml').getroot())==4
          lead=ET.parse(root/'ModExaminations.xml').getroot()
          obj=next(x for x in lead if x.get('ID')=='EXM_ABCL_G1_BLOOD_LEAD_TESTING')
          assert [x.text for x in obj.findall('Procedure/RequiredEquipmentList/RequiredEquipment/Tag')].count('abcl_art001_icp_ms')==1
          assert all(x.text!='hematoanalyzer' for x in obj.findall('Procedure/RequiredEquipmentList/RequiredEquipment/Tag'))
          icons=ET.parse(root/'ModAssetListsG2.xml').getroot()
          assert len(icons)==4 and all(x.findtext('Type')=='TEXTURE_CUSTOM_SPRITE' for x in icons)
          assert {x.get('ID') for x in icons}=={
              'ASSET_ABCL_G2_CADMIUM_64','ASSET_ABCL_G2_CADMIUM_32',
              'ASSET_ABCL_G2_MERCURY_64','ASSET_ABCL_G2_MERCURY_32'}
          assert all(x.findtext('IconIndex')=='1169'
                     for x in __import__('xml.etree.ElementTree',fromlist=['ElementTree']).parse(root/'ModDiagnosesG2.xml').getroot())
          for file in ('ModExaminations.xml','ModExaminationsG2.xml'):
              assert all(x.find('CustomIconBigAssetRef') is None and
                         x.find('CustomIconSmallAssetRef') is None
                         for x in ET.parse(root/file).getroot())
          print('G2 THREE ASSAYS TWO EXPOSURE CONDITIONS SOURCE L2 PASS.')
          print('G2 V2: only four new disease/symptom PNGs; source-only review artifact, no installable ZIP.')
          print('WARNING: C2 exclusive diagnosis, native game L4 and DLC/Workshop are NOT PASS.')
          PY
      - name: Upload ONLY noninstallable original-namepaced G2 XML source
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-G2-V2-Vanilla-Disease-Icons-And-ClinicalXML-SourceOnly-NOTINSTALLABLE
          path: |
            _output/g2/
            _output/g2_icons/
          retention-days: 7
          if-no-files-found: error
