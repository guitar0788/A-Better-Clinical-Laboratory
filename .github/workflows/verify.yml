name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository policies and tracked source data
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Print scope of this check
        run: |
          echo "Verify covers repository rules and XML syntax only."
          echo "No game-assembly compilation (L3) or Project Hospital runtime (L4) was performed."

  art:
    name: Generate pinned FA + TO source-only assets
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-tofa-unified-l4' && github.actor == 'guitar0788'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact integration revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout fixed FA source and graphics
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: cafcc32d9eb21b1f7e5df39a7f7f443d3ebf1da7
          path: _sources/fa
          persist-credentials: false
      - name: Checkout fixed TO prefabs
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: eac88c04f6d585e987b921938b76e3a3a4d4d1b0
          path: _sources/to
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original art and check authored TO layouts
        run: |
          python -m pip install "Pillow==11.3.0" "CairoSVG==2.7.1"
          python _sources/fa/tools/stage_art_001.py --output "$PWD/_proof/art001"
          python _sources/fa/tools/build_to001_floor_art.py --room-svg _sources/fa/assets/art/to001/toxicology_room_icon.svg --output "$PWD/_proof/floor"
          python -m unittest discover -s _sources/to/assets/to004/tests -p 'test_*.py' -v
          python -m unittest discover -s _sources/to/assets/to004/tools -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: TOFA-Pinned-Original-Art-SourceOnly
          path: _proof/
          retention-days: 5
          if-no-files-found: error

  build:
    needs: [verify, art]
    name: TO+FA exact-head net35 compiler validation
    if: needs.verify.result == 'success' && needs.art.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-tofa-unified-l4' && github.actor == 'guitar0788'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Recheck exact-head repository source contracts before secrets
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Exact integration head source tests failed' }
      - name: Checkout immutable FA artwork
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: cafcc32d9eb21b1f7e5df39a7f7f443d3ebf1da7
          path: _sources/fa
          persist-credentials: false
      - name: Checkout immutable TO prefab content
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: eac88c04f6d585e987b921938b76e3a3a4d4d1b0
          path: _sources/to
          persist-credentials: false
      - name: Restore exact source art staging
        uses: actions/download-artifact@v4
        with:
          name: TOFA-Pinned-Original-Art-SourceOnly
          path: _proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Decrypt owner-authorized references in temporary runner storage
        shell: pwsh
        env:
          REF_KEY: ${{ secrets.ABCL_G1_AES256_KEY }}
          REF_SHA256: 918A1E3FC74AD530AF070C012BB8075DBC3874438FE5BA3C96A8D8AD39A3FCE2
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:REF_KEY) -or $env:REF_KEY -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'ABCL_G1_AES256_KEY is not configured with a 64-character AES-256 hex key. No game DLL compilation performed.'
          }
          $encryptedFile='ABCL_G1_refs.aes'
          if (!(Test-Path -LiteralPath $encryptedFile)) {
            throw 'Encrypted ABCL_G1_refs.aes is missing from candidate commit; never fetch unencrypted public game DLLs.'
          }
          $actual=(Get-FileHash -LiteralPath $encryptedFile -Algorithm SHA256).Hash
          if ($actual -ne $env:REF_SHA256) { throw 'Encrypted game reference SHA256 mismatch. Stop without decrypting.' }
          $raw=[IO.File]::ReadAllBytes((Resolve-Path $encryptedFile))
          if ($raw.Length -le 36 -or [Text.Encoding]::ASCII.GetString($raw,0,8) -ne 'ABCLREF1') { throw 'Unsupported encrypted references envelope.' }
          $nonce=New-Object byte[] 12
          [Array]::Copy($raw,8,$nonce,0,12)
          $cipherLength=$raw.Length - 8 - 12 - 16
          $cipher=New-Object byte[] $cipherLength
          [Array]::Copy($raw,20,$cipher,0,$cipherLength)
          $tag=New-Object byte[] 16
          [Array]::Copy($raw,($raw.Length-16),$tag,0,16)
          $plaintext=New-Object byte[] $cipherLength
          $key=[Convert]::FromHexString($env:REF_KEY.Trim())
          $aes=[Security.Cryptography.AesGcm]::new($key,16)
          try { $aes.Decrypt($nonce,$cipher,$tag,$plaintext) }
          finally { $aes.Dispose(); [Array]::Clear($key,0,$key.Length) }
          $archive=Join-Path $env:RUNNER_TEMP 'g1-original-refs.zip'
          [IO.File]::WriteAllBytes($archive,$plaintext)
          [Array]::Clear($plaintext,0,$plaintext.Length)
          $root=Join-Path $env:RUNNER_TEMP 'g1-managed'
          try { Expand-Archive -LiteralPath $archive -DestinationPath $root -Force }
          finally { Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue }
          foreach ($name in @('Assembly-CSharp.dll','Assembly-CSharp-firstpass.dll','UnityEngine.dll','UnityEngine.CoreModule.dll','UnityEngine.IMGUIModule.dll')) {
            $p=Join-Path $root $name
            if (!(Test-Path -LiteralPath $p)) { throw "Genuine game DLL missing from authorized package: $name" }
            Write-Host "Reference $name SHA256: $((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash)"
          }
          "ABCL_MANAGED_DIR=$root" >> $env:GITHUB_ENV
      - name: Restore net35 reference assemblies
        shell: pwsh
        run: |
          dotnet restore src/ABCL.G1.Panel.csproj --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
      - name: Compile C# against actual game DLLs
        shell: pwsh
        run: |
          dotnet build src/ABCL.G1.Panel.csproj -c Release --no-restore -p:GameManaged="$env:ABCL_MANAGED_DIR" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Real net35 compilation failed.' }
      - name: Compose one SHA-audited TO+FA disposable-save test artifact
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/bin/Release/net35/ModABCLG1LeadTest.dll'
          if (!(Test-Path -LiteralPath $dll)) { throw 'No compiled ABCL DLL' }
          if (!([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $dll))).Contains('v2.0.50727'))) { throw 'CLR2 metadata missing' }
          New-Item -ItemType Directory -Force -Path output | Out-Null
          python tools/build_tofa_unified_l4.py --g1-dll "$dll" --fa-root _sources/fa --to-root _sources/to --art-proof _proof/art001 --floor-proof _proof/floor --source-sha "$env:CANDIDATE_SHA" --output output/ABCL_TOFA_Unified_L4_TestOnly.zip
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head combined package audit failed' }
          Write-Host 'One ZIP: G1 + TO004 prefabs + FA ART001 + TO001 private floor + TO002 read-only probe'
      - uses: actions/upload-artifact@v4
        with:
          name: ABCL-TOFA-Unified-L4-TestOnly
          path: output/*
          if-no-files-found: error
          retention-days: 5
