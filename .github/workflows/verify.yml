name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository policies and tracked source data
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Print scope of this check
        run: |
          echo "Verify covers repository rules and XML syntax only."
          echo "No game-assembly compilation (L3) or Project Hospital runtime (L4) was performed."


  art001_selfstanding_source_gate:
    name: ART001 independent integrated-base source feasibility (NOT L4)
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-art001-selfstanding-native-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact TS source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout pinned FA GameDB (not unpublished artwork or moving branch)
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: 0e8ff6720402961a102a7788dd6bbfe74e9e1d14
          path: _original_FA
          persist-credentials: false
      - name: Checkout existing G1 R3 original addon source by immutable SHA
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: 851b3059bed871d38844cffff7310de995bb2019
          path: _original_G1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original-device placement negative regressions
        run: python -m unittest discover -s tests -p test_art001_selfstanding_candidate.py -v
      - name: Run G1 lab build-filter and CBC equipment noninterference regressions
        run: python -m unittest discover -s tests -p test_art001_selfstanding_room_boundaries.py -v
      - name: Check original directional operator access and staff offsets (synthetic negative fixtures)
        run: python -m unittest discover -s tests -p test_art001_selfstanding_native_rotation.py -v
      - name: Generate isolated two center-object candidate without any image art
        run: |
          python tools/stage_art001_selfstanding_candidate.py \
            --fa-root _original_FA --output _output/selfstanding
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          d=Path("_output/selfstanding")
          data=json.loads((d/"SELFSTANDING_SOURCE_GATE.json").read_text())
          assert data["status"]=="SOURCE_ONLY_NOT_INSTALLABLE"
          assert data["frozen_FA_commit"]=="0e8ff6720402961a102a7788dd6bbfe74e9e1d14"
          assert data["workbench_object_included"] is False
          assert data["FA_latest_two_1254px_4view_images"]=="NOT IN PUBLIC BRANCH"
          root=ET.parse(d/"Database/ModObjectsABCLSelfStandingCandidate.xml").getroot()
          objects=root.findall("GameDBObject")
          assert len(objects)==2
          for o in objects:
              assert o.findtext("AttachedToObject")=="false"
              assert o.findtext("Placement")=="INDOORS"
              assert o.find("AttachmentSlot") is None
          print("PASS: original-FA-sha independent-base source candidate, two center objects, no workbench")
          print("NOT A GAME INSTALLER; NOT VISUAL ACCEPTANCE; NO CLINICAL EXAM DEVICE BINDING")
          PY
      - name: Verify the unchanged G1 native lab building category and required equipment
        run: |
          python tools/audit_art001_selfstanding_room_boundaries.py \
            --candidate _output/selfstanding/Database/ModObjectsABCLSelfStandingCandidate.xml \
            --g1-room _original_G1/assets/g1/Database/ModRoomTypes.xml \
            --output _output/selfstanding/ROOM_BOUNDARY_SOURCE_GATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("_output/selfstanding/ROOM_BOUNDARY_SOURCE_GATE.json").read_text())
          assert d["scope"]=="SOURCE_ONLY_ROOM_FILTER_GATE"
          assert d["required_hematoanalyzer_and_ria"]=="UNCHANGED"
          assert d["clinical_assay_dispatch"]=="NOT_IMPLEMENTED_FOR_NEW_DEVICES"
          assert len(d["devices"])==2
          print("PASS: private self-based devices are additive in existing lab equipment category")
          print("Original G1 hematoanalyzer / RIA mandatory; original CBC not replaced.")
          print("CAUTION: generic build-category visibility is not a Toxicology-only UI guarantee.")
          PY
      - name: Audit exact derived device 4-way access and staff positions
        run: |
          python tools/audit_art001_selfstanding_native_rotation.py \
            --candidate _output/selfstanding/Database/ModObjectsABCLSelfStandingCandidate.xml \
            --output _output/selfstanding/NATIVE_DIRECTIONAL_OPERATOR_SOURCE_GATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("_output/selfstanding/NATIVE_DIRECTIONAL_OPERATOR_SOURCE_GATE.json").read_text())
          assert data["status"]=="NATIVE_SOURCE_SEMANTICS_TESTED_NOT_GAMEPLAY_L4"
          assert data["game_L4"]=="NOT_RUN"
          for obj in data["objects"].values():
              assert obj["native_access_tile_relative_to_device"]=={
                  "NW":[-1,0], "NE":[0,-1], "SE":[1,0], "SW":[0,1]}
          print("PASS: all four relative operator tiles; no forced parent or altered native clinical tags")
          print("WARNING: actual staff routes/use animations and four-view sprite art remain L4 UNTESTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ART001-TS-SelfStanding-Source-Feasibility-NOT-INSTALLABLE
          path: _output/selfstanding/
          retention-days: 7
          if-no-files-found: error


  art001_fa_submitted_source_integration:
    name: ART001 exact FA submitted images -> standalone private native art (L2 only)
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-art001-fa-submitted-standalone-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout exact TS source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout immutable FA owner-submitted image set
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: cb3a7ab5d03e8677dcb84f486a04bf0ea5f8f622
          path: _approved_FA_source_submission
          persist-credentials: false
      - name: Checkout previously working G1 clinical room definition
        uses: actions/checkout@v4
        with:
          repository: guitar0788/A-Better-Clinical-Laboratory
          ref: 851b3059bed871d38844cffff7310de995bb2019
          path: _original_G1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependency
        run: python -m pip install "Pillow==11.3.0"
      - name: Verify exact submitted FA 11 source PNGs and 128px atlas cells
        run: |
          python _approved_FA_source_submission/tools/verify_art001_submitted_images.py
          python -m unittest discover -s tests -p test_art001_fa_submitted_integration.py -v
      - name: Create exact-image independent native art overlay staging (NO INSTALL)
        run: |
          python tools/stage_art001_fa_submitted_standalone.py \
            --fa-root _approved_FA_source_submission \
            --output _output/art001_FA_submitted
          python tools/audit_art001_selfstanding_room_boundaries.py \
            --candidate _output/art001_FA_submitted/Database/ModObjectsABCL.xml \
            --g1-room _original_G1/assets/g1/Database/ModRoomTypes.xml \
            --output _output/art001_FA_submitted/ROOM_BOUNDARY_SOURCE_GATE.json
          python tools/audit_art001_selfstanding_native_rotation.py \
            --candidate _output/art001_FA_submitted/Database/ModObjectsABCL.xml \
            --output _output/art001_FA_submitted/NATIVE_DIRECTIONAL_OPERATOR_SOURCE_GATE.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          from xml.etree import ElementTree as ET
          from PIL import Image
          root=Path("_output/art001_FA_submitted")
          m=json.loads((root/"ART001_TS_INTEGRATION_MANIFEST.json").read_text())
          assert m["status"]=="G1_RESOURCE_OVERLAY_CANDIDATE_L2_ONLY_NOT_INSTALLABLE"
          assert m["frozen_FA_sha"]=="cb3a7ab5d03e8677dcb84f486a04bf0ea5f8f622"
          assert m["original_FA_manifest_hashes_verified"]==11
          assert m["artwork"]["atlas"]=="b412b384056f1bc6e036175a4780523fb667959447d253f3b9778f1ee1d6f651"
          assert not m["G1_source_or_DLL_modified"]
          assert m["independent_game_L4"]=="NOT_RUN"
          assert not m["artwork"]["art_source_changed"]
          assert len(m["native_objects"])==2
          for p,sha in m["generated_runtime_XML_and_asset_sha256"].items():
              assert hashlib.sha256((root/p).read_bytes()).hexdigest()==sha,p
          o=ET.parse(root/"Database/ModObjectsABCL.xml").getroot()
          assert {x.get("ID") for x in o}=={
              "OBJECT_ABCL_ART001_ICP_MS","OBJECT_ABCL_ART001_DIGESTION"}
          assert all(x.findtext("AttachedToObject")=="false" for x in o)
          assert all(x.findtext("Placement")=="INDOORS" for x in o)
          with Image.open(root/"Assets/ABCL/equipment_atlas.png") as im:
              assert im.size==(2048,1024) and im.mode=="RGBA"
          assert len(list(root.rglob("*.dll")))==0
          print("FA SOURCE INTEGRATED: 11/11 SHA, exact atlas, 2 independent equipment GameDB entries.")
          print("SOURCE-ONLY PASS. NOT game install, not owner visual acceptance, not G1 examination use.")
          PY
      - name: Upload review-only device resources and sha evidence
        uses: actions/upload-artifact@v4
        with:
          name: ART001-FA-Submitted-Standalone-G1-SourceOverlay-L2-NOT-INSTALLABLE
          path: _output/art001_FA_submitted/
          retention-days: 5
          if-no-files-found: error


  art001_fa_windows_mock:
    name: ART001 FA exact-source test-only G1 Windows install / uninstall mock
    needs: [verify, art001_fa_submitted_source_integration]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/ts-art001-fa-submitted-standalone-integration'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact TS source and safe scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download only the exact-head L2 verified private resources
        uses: actions/download-artifact@v4
        with:
          name: ART001-FA-Submitted-Standalone-G1-SourceOverlay-L2-NOT-INSTALLABLE
          path: _verified_art001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pack independently verified test-only ART001 overlay (no G1 binary)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path output -Force | Out-Null
          python tools/package_art001_standalone_test_only.py --stage _verified_art001 --out output/ABCL_ART001_FA_Standalone_L4_TestOnly.zip
          if ($LASTEXITCODE -ne 0) { throw "ART001 package audit failed" }
      - name: Mock Windows game addon ownership / no-overwrite / rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bundle=Join-Path $env:RUNNER_TEMP 'ABCL_ART001_TEST_BUNDLE'
          Expand-Archive -LiteralPath output/ABCL_ART001_FA_Standalone_L4_TestOnly.zip -DestinationPath $bundle
          $game=Join-Path $env:RUNNER_TEMP 'ABCL_ART001_MOCK_GAME'
          $g1=Join-Path $game 'ProjectHospital_Data\StreamingAssets\Addons\ModABCLG1LeadTest'
          $other=Join-Path $game 'ProjectHospital_Data\StreamingAssets\Addons\UnrelatedWorkshop'
          New-Item -ItemType Directory -Force -Path (Join-Path $g1 'Database'),$other | Out-Null
          [IO.File]::WriteAllText((Join-Path $g1 'Database\ModAddon.xml'), '<Database><GameDBAddon ID="ADDON_MOD_ABCL_G1_LEAD_TEST"/></Database>')
          [IO.File]::WriteAllText((Join-Path $g1 'Database\ModRoomTypes.xml'), '<Database><GameDBRoomType ID="ROOM_TYPE_ABCL_G1_TOXICOLOGY_LAB"><RequiredEquipment><GameDBRequiredEquipment><Tag>ui_hematoanalyzer</Tag></GameDBRequiredEquipment><GameDBRequiredEquipment><Tag>ui_ria</Tag></GameDBRequiredEquipment></RequiredEquipment></GameDBRoomType></Database>')
          [IO.File]::WriteAllText((Join-Path $g1 'ModABCLG1LeadTest.dll'), 'MOCK DLL — NEVER SHIPPED')
          [IO.File]::WriteAllText((Join-Path $g1 'Database\ModPrefabObjectsTO004.xml'), 'TO004-V3-PROTECTED')
          [IO.File]::WriteAllText((Join-Path $other 'sentinel.txt'), 'WORKSHOP-PROTECTED')
          $install=Join-Path $bundle 'tools\Install-ART001-Standalone-Into-G1.ps1'
          $remove=Join-Path $bundle 'tools\Uninstall-ART001-Standalone-From-G1.ps1'
          & $install -GameRoot $game
          $info=Get-Content -LiteralPath (Join-Path $bundle 'ART001_TS_INTEGRATION_MANIFEST.json') -Raw | ConvertFrom-Json
          $files=@($info.generated_runtime_XML_and_asset_sha256.PSObject.Properties)
          if ($files.Count -ne 7) { throw 'Exactly seven new ART assets required' }
          foreach ($item in $files) {
            $path=Join-Path $g1 $item.Name.Replace('/','\')
            if (!(Test-Path -LiteralPath $path)) { throw "ART file missing: $($item.Name)" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $item.Value.ToLowerInvariant()) {
              throw "ART file altered: $($item.Name)"
            }
          }
          $rejected=$false
          try { & $install -GameRoot $game } catch { $rejected=$true }
          if (!$rejected) { throw "ART001 duplicate installer must refuse to overwrite" }
          $icon=Join-Path $g1 'Assets\ABCL\icp_ms_icon.png'
          [IO.File]::WriteAllBytes($icon, [byte[]](1,2,3,4))
          $changedRejected=$false
          try { & $remove -GameRoot $game } catch { $changedRejected=$true }
          if (!$changedRejected) { throw "ART001 modified-file uninstall must refuse deletion" }
          Copy-Item -LiteralPath (Join-Path $bundle 'Assets\ABCL\icp_ms_icon.png') -Destination $icon -Force
          & $remove -GameRoot $game
          foreach ($item in $files) {
            $path=Join-Path $g1 $item.Name.Replace('/','\')
            if (Test-Path -LiteralPath $path) { throw "ART001 uninstall left added file: $($item.Name)" }
          }
          if ([IO.File]::ReadAllText((Join-Path $g1 'ModABCLG1LeadTest.dll')) -ne 'MOCK DLL — NEVER SHIPPED') { throw "G1 DLL changed" }
          if ([IO.File]::ReadAllText((Join-Path $g1 'Database\ModPrefabObjectsTO004.xml')) -ne 'TO004-V3-PROTECTED') { throw "TO004 modified" }
          if ([IO.File]::ReadAllText((Join-Path $other 'sentinel.txt')) -ne 'WORKSHOP-PROTECTED') { throw "Other Workshop modified" }
          Write-Host "ART001 WINDOWS MOCK PASS: 7 exact FA assets; G1/TO004/Workshop safe, duplicate/corruption refused, rollback clean"
          Write-Host "This is NOT an actual installed-game L4."
      - name: Upload test-only ART001 overlay after Windows mock
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-FA-Standalone-L4-TestOnly
          path: output/ABCL_ART001_FA_Standalone_L4_TestOnly.zip
          if-no-files-found: error
          retention-days: 5
