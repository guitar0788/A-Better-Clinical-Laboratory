name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository policies and tracked source data
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Print scope of this check
        run: |
          echo "Verify covers repository rules and XML syntax only."
          echo "No game-assembly compilation (L3) or Project Hospital runtime (L4) was performed."

  audit-g1-runs:
    name: Read-only G1 automatic Windows build run history
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/g1-run-visibility-audit-20261104' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List G1 workflow_run executions, without original game references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          if repo != 'guitar0788/A-Better-Clinical-Laboratory':
              raise SystemExit('Unexpected repository; refusing run metadata query')
          workflow = 'auto-build-g1-verified.yml'
          base = 'https://api.github.com/repos/' + repo + '/actions/workflows/' + workflow + '/runs'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ABCL-G1-readonly-run-audit',
          }
          all_runs = []
          for page in range(1, 4):
              params = urllib.parse.urlencode({'per_page': 100, 'page': page})
              request = urllib.request.Request(base + '?' + params, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              batch = payload.get('workflow_runs', [])
              all_runs.extend(batch)
              if len(batch) < 100:
                  break
          print('G1_WORKFLOW_RUN_COUNT_LOADED=' + str(len(all_runs)))
          print('G1_WORKFLOW_RUNS_TOTAL_REPORTED=' + str(payload.get('total_count')))
          print('Diagnostic outputs run metadata only; no secrets, logs, or DLL contents.')
          for entry in all_runs[:80]:
              print('G1_RUN ' + json.dumps({
                  'id': entry.get('id'),
                  'event': entry.get('event'),
                  'status': entry.get('status'),
                  'conclusion': entry.get('conclusion'),
                  'head_branch': entry.get('head_branch'),
                  'head_sha': entry.get('head_sha'),
                  'created_at': entry.get('created_at'),
                  'run_attempt': entry.get('run_attempt'),
                  'html_url': entry.get('html_url'),
              }, sort_keys=True))
          PY
