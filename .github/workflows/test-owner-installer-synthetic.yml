name: ABCL owner-pinned installer synthetic Windows safety

on:
  push:
    branches: [fix/tofa-owner-approved-package-gate-20261104]
    paths:
      - 'tools/Install-ABCL-Full-Test.ps1'
      - 'tools/INSTALL_ABCL_FULL_TEST.cmd'
      - 'tools/RESTORE_ABCL_FULL_TEST.cmd'
      - '.github/workflows/test-owner-installer-synthetic.yml'
  pull_request:
    paths:
      - 'tools/Install-ABCL-Full-Test.ps1'
      - 'tools/INSTALL_ABCL_FULL_TEST.cmd'
      - 'tools/RESTORE_ABCL_FULL_TEST.cmd'
      - '.github/workflows/test-owner-installer-synthetic.yml'

permissions:
  contents: read

jobs:
  synthetic-windows-install:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and execute owner test installer against fake game directories
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $errors=$null
          $tokens=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/Install-ABCL-Full-Test.ps1').Path,
            [ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw "PowerShell parser errors: $errors" }
          $work=Join-Path $env:RUNNER_TEMP 'ABCL-synthetic-owner'
          $game=Join-Path $work 'Mock Project Hospital'
          $mods=Join-Path $game 'ProjectHospital_Data/StreamingAssets/Addons'
          $db=Join-Path $game 'ProjectHospital_Data/StreamingAssets/Database'
          $package=Join-Path $work 'package'
          foreach($folder in @($mods,$db,$package)) {
            New-Item -Path $folder -ItemType Directory -Force | Out-Null
          }
          foreach($name in @('ModABCLG1LeadTest','ModABCLArt001Test')) {
            foreach($dest in @((Join-Path $mods $name),(Join-Path $package $name))) {
              New-Item -Path (Join-Path $dest 'Database') -ItemType Directory -Force | Out-Null
              $id=if($name -eq 'ModABCLG1LeadTest') {'ADDON_MOD_ABCL_G1_LEAD_TEST'}else{'ADDON_MOD_ABCL_ART001_PREVIEW'}
              [IO.File]::WriteAllText((Join-Path $dest 'Database/ModAddon.xml'),("<Database><GameDBAddon ID='$id'/></Database>"))
            }
            [IO.File]::WriteAllText((Join-Path (Join-Path $mods $name) 'old-marker.txt'),"existing-$name")
            [IO.File]::WriteAllText((Join-Path (Join-Path $package $name) 'new-marker.txt'),"new-$name")
          }
          $other=Join-Path $mods 'UnrelatedWorkshopMod'
          New-Item -Path $other -ItemType Directory | Out-Null
          [IO.File]::WriteAllText((Join-Path $other 'keep.txt'),'UNRELATED NEVER TOUCH')
          $otherHash=(Get-FileHash (Join-Path $other 'keep.txt')).Hash
          Copy-Item -LiteralPath 'tools/Install-ABCL-Full-Test.ps1' -Destination (Join-Path $package 'Install-ABCL-Full-Test.ps1')
          $mockG1=@'
          param([string]$GameRoot,[switch]$NativeLeadTest)
          if (!$NativeLeadTest) { throw 'native test flag missing' }
          $addons=Join-Path $GameRoot 'ProjectHospital_Data/StreamingAssets/Addons'
          $target=Join-Path $addons 'ModABCLG1LeadTest'
          if (Test-Path -LiteralPath $target) {throw 'old test addon was not moved'}
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot 'ModABCLG1LeadTest') -Destination $target -Recurse
          [IO.File]::WriteAllText((Join-Path $target 'Database/ModDepartments.xml'),'<Database><GameDBDepartment ID="DPT_LAB"/></Database>')
          [IO.File]::WriteAllText((Join-Path $target 'Database/ModDiagnoses.xml'),'<Database><GameDBMedicalCondition ID="TRM_LDP"/></Database>')
          '@
          [IO.File]::WriteAllText((Join-Path $package 'Install-ABCL-G1.ps1'),$mockG1)
          [IO.File]::WriteAllText((Join-Path $package 'INSTALL_ABCL_FULL_TEST.cmd'),'@echo off')
          [IO.File]::WriteAllText((Join-Path $package 'RESTORE_ABCL_FULL_TEST.cmd'),'@echo off')
          [IO.File]::WriteAllText((Join-Path $package 'README_FIRST_CN.txt'),'source-only MOCK TEST')
          function Manifest {
            $files=@{}
            Get-ChildItem -LiteralPath $package -Recurse -File |
              Where-Object { $_.Name -ne 'BUILD_INFO.json' -and $_.Name -ne 'ABCL_INSTALL_STATE.json' -and $_.Name -notlike 'ABCL_RESTORED_*' -and $_.FullName -notmatch '_ABCL_OWNER_BACKUP_' } |
              ForEach-Object {
                $rel=$_.FullName.Substring($package.Length+1).Replace('\','/')
                $files[$rel]=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            [ordered]@{schema='ABCL_OWNER_PINNED_TEST_ONLY_V1';native_game_L4='NOT_RUN';
              compiled_g1_source_sha=('a'*40);dll_sha256=('b'*64);entries=$files} |
              ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $package 'BUILD_INFO.json') -Encoding UTF8
          }
          Manifest
          $script=Join-Path $package 'Install-ABCL-Full-Test.ps1'
          & $script -GameRoot $game
          if (!(Test-Path (Join-Path $mods 'ModABCLG1LeadTest/new-marker.txt')) -or
              !(Test-Path (Join-Path $mods 'ModABCLArt001Test/new-marker.txt'))) {throw 'initial install failed'}
          if (!(Test-Path (Join-Path $package 'ABCL_INSTALL_STATE.json'))) {throw 'backup state missing'}
          & $script -GameRoot $game
          & $script -GameRoot $game -Restore
          foreach($name in @('ModABCLG1LeadTest','ModABCLArt001Test')) {
            if (!(Test-Path (Join-Path (Join-Path $mods $name) 'old-marker.txt'))) {throw 'old addon was not restored'}
          }
          if ((Get-FileHash (Join-Path $other 'keep.txt')).Hash -ne $otherHash) {throw 'third-party mod changed'}
          # Fail the delegated G1 installer after old folders have been backed up.
          [IO.File]::WriteAllText((Join-Path $package 'Install-ABCL-G1.ps1'),"param([string]$GameRoot,[switch]$NativeLeadTest) throw 'intentional failure'")
          Manifest
          $failed=$false
          try { & $script -GameRoot $game } catch { $failed=$true }
          if (!$failed) {throw 'injected failure unexpectedly succeeded'}
          foreach($name in @('ModABCLG1LeadTest','ModABCLArt001Test')) {
            if (!(Test-Path (Join-Path (Join-Path $mods $name) 'old-marker.txt'))) {throw 'rollback did not restore old ABCL'}
          }
          if ((Get-FileHash (Join-Path $other 'keep.txt')).Hash -ne $otherHash) {throw 'third-party file changed after rollback'}
          Write-Host 'PASS: PowerShell AST, first install, idempotence, exact two-addon restore, failure rollback, unrelated Workshop preservation'
