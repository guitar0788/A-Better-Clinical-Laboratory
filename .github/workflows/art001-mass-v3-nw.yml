name: ART-001 Mass Structural Redesign V3 - NW Source Review
on:
  push:
    branches: [feature/art-001-two-devices]
    paths: [tools/art001_mass_redesign_v3.py, .github/workflows/art001-mass-v3-nw.yml]
  pull_request:
    paths: [tools/art001_mass_redesign_v3.py, .github/workflows/art001-mass-v3-nw.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-analyzer-redesign:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure original authored source compiles
        run: |
          python -m py_compile tools/art001_mass_redesign_v3.py
          python -m py_compile tools/art001_mass_redesign_v2.py
      - name: Install pinned cloud-only 3D source and antialias renderer
        run: python -m pip install --disable-pip-version-check "bpy==4.5.15" "Pillow==12.3.0"
      - name: Author NW physical machine and export 1024px plus smooth source
        run: python tools/art001_mass_redesign_v3.py --output "$RUNNER_TEMP/ABCL-ART001-NW-V3"
      - name: Verify one original smooth 2D native-size source and provenance
        run: |
          python - <<'PY'
          import os,json,zipfile,hashlib
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ["RUNNER_TEMP"])/"ABCL-ART001-NW-V3"
          m=json.loads((root/"manifest.json").read_text())
          assert m["source_only"] and m["not_installable"]
          assert not m["owner_visual_approved"] and not m["game_l4_tested"]
          assert m["direction"]=="NW" and m["cell"]==[128,128]
          assert m["source_render"]==[1024,1024] and not m["palette_quantized"]
          assert m["has_physical_operator_lcd"] and m["sampler_vials"]==7
          assert len(m["sha256"])==5
          img=root/"mass_spectrometer_NW_V3_original_smooth_128.png"
          with Image.open(img) as im:
              assert im.size==(128,128) and im.mode=="RGBA"
              alpha=im.getchannel("A")
              assert alpha.getbbox()
              assert len({x for x in alpha.getdata() if 0<x<255})>=12
          with zipfile.ZipFile(root/"mass_spectrometer_NW_V3_editable.ora") as z:
              assert z.read("mimetype")==b"image/openraster"
              assert {"data/shell.png","data/ink.png","mergedimage.png"}.issubset(z.namelist())
          for filename,sha in m["sha256"].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==sha
          assert (root/"ART001_V3_mass_3D_editable.blend").stat().st_size>1000
          assert not list(root.rglob("*.dll")) and not list(root.rglob("*.aes"))
          print("PASS: original physical V3 mesh with independent monitor / one NW native sprite (L2 only)")
          PY
      - name: Publish review-only artwork and editable model - NO installer
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-MASS-V3-NW-REVIEW-NOT-INSTALLABLE
          path: ${{ runner.temp }}/ABCL-ART001-NW-V3/
          retention-days: 7
          if-no-files-found: error
