name: Verify Project Hospital code-mod loader prerequisite (Harmony 1 official)
on:
  push:
    branches:
      - fix/native-loader-harmony1-20261104
permissions:
  contents: read
jobs:
  official-harmony:
    name: Verify genuine Harmony 1.2.0.1 assembly for test-only ABCL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download authentic release from upstream publisher, never create stub DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _proof _source
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://github.com/pardeike/Harmony/releases/download/v1.2.0.1/Release.zip' \
            -o _source/Harmony_v1.2.0.1_Release.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          archive=Path('_source/Harmony_v1.2.0.1_Release.zip')
          with zipfile.ZipFile(archive) as z:
              entries=z.namelist()
              libs=[x for x in entries if x.lower()=='release/net35/0harmony.dll']
              assert len(libs)==1, f'Expected one official 0Harmony.dll, found: {libs}'
              dll=z.read(libs[0])
          assert len(dll)>16000 and dll[:2]==b'MZ' and b'BSJB' in dll, 'Invalid .NET assembly'
          assert b'HarmonyInstance' in dll, 'Not Harmony 1.x API'
          Path('_proof/0Harmony.dll').write_bytes(dll)
          Path('_proof/SOURCE_PROVENANCE.json').write_text(
              json.dumps({'upstream':'https://github.com/pardeike/Harmony',
                          'release':'v1.2.0.1','archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                          'dll_sha256':hashlib.sha256(dll).hexdigest(),
                          'dll_bytes':len(dll),'origin_member':libs[0]},indent=2)+'\n')
          print(Path('_proof/SOURCE_PROVENANCE.json').read_text())
          PY
          echo "OFFICIAL_HARMONY1_ARCHIVE_SHA256=$(sha256sum _source/Harmony_v1.2.0.1_Release.zip | cut -d' ' -f1)"
          echo "OFFICIAL_HARMONY1_DLL_SHA256=$(sha256sum _proof/0Harmony.dll | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Official-Harmony1.2.0.1-LoaderPrerequisite-L2
          path: _proof/*
          if-no-files-found: error
          retention-days: 7
