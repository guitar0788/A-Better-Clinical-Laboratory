name: ART-001 One Native Sprite Paintover Review (No Installer)

on:
  push:
    branches: [feature/art-001-two-devices]
    paths: ["tools/art001_native_paintover.py", ".github/workflows/art001-single-sprite-review.yml"]
  pull_request:
    paths: ["tools/art001_native_paintover.py", ".github/workflows/art001-single-sprite-review.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-sprite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned cloud-only renderer and paint dependencies
        run: python -m pip install --disable-pip-version-check "bpy==4.5.15" "Pillow==12.3.0" "numpy==2.3.3"
      - name: Generate original ABCL 3D source preview
        run: python tools/art001_blender_render.py --output "$RUNNER_TEMP/art001-original-blender"
      - name: Paint one 128px NW original sprite and editable layers
        run: python tools/art001_native_paintover.py --source "$RUNNER_TEMP/art001-original-blender/Native128/mass_spectrometer_NW.png" --output "$RUNNER_TEMP/art001-nw-paintover"
      - name: Verify editable native-size one-direction source
        run: |
          python - <<'PY'
          import os,json,hashlib,zipfile
          from pathlib import Path
          from PIL import Image
          p=Path(os.environ["RUNNER_TEMP"])/"art001-nw-paintover"
          m=json.loads((p/"manifest.json").read_text())
          assert m["direction"]=="NW" and m["cell"]==[128,128]
          assert m["not_installable"] and not m["game_l4"] and not m["visual_accepted"]
          with Image.open(p/"mass_spectrometer_NW_original_128.png") as im:
              assert im.mode=="RGBA" and im.size==(128,128) and im.getchannel("A").getbbox()
          with zipfile.ZipFile(p/"mass_spectrometer_NW_editable_layers.ora") as z:
              assert z.read("mimetype")==b"image/openraster"
              assert len([x for x in z.namelist() if x.startswith("data/")])==4
          for n,h in m["sha256"].items():
              assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h
          print("FA source-only contract PASS - artistic approval NOT claimed")
          PY
      - name: Upload review only; no game package
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-ONE-NW-128PX-VISUAL-REVIEW-ONLY
          path: ${{ runner.temp }}/art001-nw-paintover/
          retention-days: 7
          if-no-files-found: error
