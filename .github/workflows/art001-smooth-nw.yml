name: ART-001 Smooth 2D NW Source Review
on:
  push:
    branches: [feature/art-001-two-devices]
    paths: [tools/art001_smooth_nw.py, .github/workflows/art001-smooth-nw.yml]
  pull_request:
    paths: [tools/art001_smooth_nw.py, .github/workflows/art001-smooth-nw.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smooth-nw:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model renderer
        run: python -m pip install --disable-pip-version-check "bpy==4.5.15" "Pillow==12.3.0"
      - name: Create original editable 3D base
        run: python tools/art001_blender_render.py --output "$RUNNER_TEMP/FA-Original"
      - name: Render and finish one smooth original NW source
        run: python tools/art001_smooth_nw.py --blend "$RUNNER_TEMP/FA-Original/Sources/ART001_original_editable_3D.blend" --output "$RUNNER_TEMP/FA-Smooth"
      - name: Verify continuous shading and alpha
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['RUNNER_TEMP'])/'FA-Smooth'
          m=json.loads((root/'manifest.json').read_text())
          assert m['original_768px_render'] and m['resampler']=='Lanczos'
          assert not m['quantized_palette'] and not m['pixel_nearest_neighbor']
          assert m['not_installable'] and not m['game_l4'] and not m['owner_visual_approved']
          with Image.open(root/'mass_spectrometer_NW_smooth_antialiased_128.png') as im:
              assert im.size==(128,128) and im.mode=='RGBA'
              assert len(set(a for a in im.getchannel('A').getdata() if 0<a<255))>=12
          for filename,digest in m['sha256'].items():
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==digest
          PY
      - name: Upload review-only sprite and layers, not game installation
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-NW-SMOOTH-2D-STUDY-ONLY
          path: ${{ runner.temp }}/FA-Smooth/
          retention-days: 7
          if-no-files-found: error
