name: ART-001 Smooth SVG Source Preview (NOT a game package)

on:
  pull_request:
    paths:
      - 'tools/generate_art_001_svg.py'
      - 'tests/test_art_001_svg.py'
      - 'tests/test_art_001_assets.py'
      - 'assets/art001/Database/**'
      - 'tools/stage_art_001.py'
      - 'tools/build_art001_placement_test.py'
      - 'docs/LAB_VISUAL_STANDARD.md'
      - 'docs/ART_001_ASSET_CONTRACT.md'
      - '.github/workflows/art-001-preview.yml'
  push:
    branches:
      - feature/art-001-two-devices
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-antialiased-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline vector rasterizer
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.3.0"
      - name: Run anti-alias and original art source tests
        run: python -m unittest discover -s tests -p 'test_art_001_svg.py' -v
      - name: Run XML, private palette, icon and isolated staging contracts
        run: python -m unittest discover -s tests -p 'test_art_001_assets.py' -v
      - name: Generate original SVG sources and antialiased PNG preview
        run: |
          set -euo pipefail
          python tools/generate_art_001_svg.py --output "$RUNNER_TEMP/ART001-Antialias-Proof"
          test -s "$RUNNER_TEMP/ART001-Antialias-Proof/Previews/ABCL/direction_preview.png"
          test -s "$RUNNER_TEMP/ART001-Antialias-Proof/Assets/ABCL/equipment_atlas.png"
          test -s "$RUNNER_TEMP/ART001-Antialias-Proof/Assets/ABCL/workbench_icon.png"
          test "$(find "$RUNNER_TEMP/ART001-Antialias-Proof/Sources/ABCL" -name '*.svg' | wc -l)" -eq 9
      - name: Upload review-only source and preview (NO installer)
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-ART001-V7-ANTIALIASED-REVIEW-NOT-INSTALLABLE
          path: ${{ runner.temp }}/ART001-Antialias-Proof/
          retention-days: 7
          if-no-files-found: error

      - name: Summarize mobile preview and acceptance limits
        if: success()
        shell: bash
        run: |
          {
            echo '### ART-001 V7 original-art preview'
            echo ''
            echo 'Open the artifact at the bottom of this workflow run:'
            echo '**ABCL-ART001-V7-ANTIALIASED-REVIEW-NOT-INSTALLABLE**'
            echo ''
            echo '- `Previews/ABCL/review_mobile.png`: eight directions and all three custom icons in one phone-friendly review sheet.'
            echo '- `Previews/ABCL/direction_preview.png`: native-scale directions.'
            echo '- `Assets/ABCL/equipment_atlas.png`: 2048x1024 source-only atlas.'
            echo ''
            echo '**NOT an installed-game screenshot, approved artwork, L4 test, or installable package.**'
          } >> "$GITHUB_STEP_SUMMARY"
