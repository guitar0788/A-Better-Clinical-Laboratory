name: Build G1 approved candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Approved 40-character G1 commit SHA"
        required: true
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: g1-owner-only-build
  cancel-in-progress: false
jobs:
  build:
    name: Genuine net35 compiler validation
    if: github.ref == 'refs/heads/main' && github.actor == 'guitar0788'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Gate on an immutable, Verify-passed commit
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-fA-F]{40}$') { throw 'Candidate must be a 40-character commit SHA.' }
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='ABCL-G1-owner'}
          $url="https://api.github.com/repos/$env:REPOSITORY/commits/$env:CANDIDATE_SHA/check-runs"
          $result=Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop
          $passes=@($result.check_runs | Where-Object { $_.name -eq 'Verify' -and $_.conclusion -eq 'success' -and $_.app.slug -eq 'github-actions' })
          if ($passes.Count -eq 0) { throw 'Candidate has no successful GitHub Actions Verify check; refuse private input.' }
          Write-Host "Verified SHA $env:CANDIDATE_SHA; human code review remains mandatory."
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Download private game references and validate SHA256
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.ABCL_G1_SOURCE_URL }}
          SOURCE_SHA: ${{ secrets.ABCL_G1_SOURCE_SHA256 }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_URL) -or [string]::IsNullOrWhiteSpace($env:SOURCE_SHA)) { throw 'ABCL_G1_SOURCE_URL / ABCL_G1_SOURCE_SHA256 secrets not set; no L3 build attempted.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{64}$') { throw 'Source SHA256 is invalid.' }
          $uri=[Uri]$env:SOURCE_URL
          if ($uri.Scheme -ne 'https') { throw 'Private reference URL must use HTTPS.' }
          $archive=Join-Path $env:RUNNER_TEMP 'g1-private-input.zip'
          Invoke-WebRequest -Uri $uri -OutFile $archive -ErrorAction Stop
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:SOURCE_SHA.ToUpperInvariant()) { throw 'Source SHA256 mismatch. No build.' }
          $root=Join-Path $env:RUNNER_TEMP 'g1-managed'
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          Remove-Item -LiteralPath $archive -Force
          foreach ($name in @('Assembly-CSharp.dll','Assembly-CSharp-firstpass.dll','UnityEngine.dll','UnityEngine.CoreModule.dll','UnityEngine.IMGUIModule.dll')) {
            $p=Join-Path $root $name
            if (!(Test-Path -LiteralPath $p)) { throw "Genuine game DLL missing: $name" }
            Write-Host "$name SHA256: $((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash)"
          }
          "ABCL_MANAGED_DIR=$root" >> $env:GITHUB_ENV
      - name: Restore net35 reference assemblies
        shell: pwsh
        run: |
          dotnet restore src/ABCL.G1.Panel.csproj --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
      - name: Compile C# against actual game DLLs
        shell: pwsh
        run: |
          dotnet build src/ABCL.G1.Panel.csproj -c Release --no-restore -p:GameManaged="$env:ABCL_MANAGED_DIR" --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Real net35 compilation failed.' }
      - name: Create ABCL-only test artifact
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $dll='src/bin/Release/net35/ModABCLG1LeadTest.dll'
          if (!(Test-Path -LiteralPath $dll)) { throw 'No ABCL DLL produced.' }
          if (!([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $dll))).Contains('v2.0.50727'))) { throw 'CLR2 metadata version not found.' }
          $stage=Join-Path $env:RUNNER_TEMP 'abcl-g1-package'
          $addon=Join-Path $stage 'ModABCLG1LeadTest'
          New-Item -ItemType Directory -Path (Join-Path $addon 'Database') -Force | Out-Null
          Copy-Item assets/g1/Database/*.xml -Destination (Join-Path $addon 'Database')
          Copy-Item $dll -Destination (Join-Path $addon 'ModABCLG1LeadTest.dll')
          # Placeholder required by original native loader; it is never loaded.
          [IO.File]::WriteAllBytes((Join-Path $addon '0Harmony.dll'),[byte[]]@())
          Copy-Item tools/Install-ABCL-G1.ps1,tools/INSTALL_G1.cmd,tools/G1_TEST_README.txt -Destination $stage
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath output/ABCL_G1_Compiled_Install_TestOnly.zip
          $hash=(Get-FileHash $dll -Algorithm SHA256).Hash
          @('G1 TEST ONLY: real DLL compilation does NOT establish gameplay L4', "CANDIDATE_SHA=$env:CANDIDATE_SHA", "DLL_SHA256=$hash") | Set-Content output/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ABCL-G1-Compiled-TestOnly
          path: output/*
          if-no-files-found: error
          retention-days: 7
