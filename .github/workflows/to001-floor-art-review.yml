name: TO-001 Native Floor Art — FA L2

on:
  push:
    branches: [feature/art-001-two-devices]
    paths:
      - "assets/art/to001/toxicology_room_icon.svg"
      - "assets/art/to001/toxicology_floor_glyph.svg"
      - "tools/build_to001_floor_art.py"
      - ".github/workflows/to001-floor-art-review.yml"
  pull_request:
    paths:
      - "assets/art/to001/toxicology_room_icon.svg"
      - "assets/art/to001/toxicology_floor_glyph.svg"
      - "tools/build_to001_floor_art.py"
      - ".github/workflows/to001-floor-art-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-two-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.3.0"
      - name: Render original native floor and private 16x32 atlas
        run: |
          python tools/build_to001_floor_art.py \
            --room-svg assets/art/to001/toxicology_room_icon.svg \
            --output "$RUNNER_TEMP/TO001-floor"
      - name: Check exact native sizes, source identity and atlas containment
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path(os.environ["RUNNER_TEMP"])/"TO001-floor"
          m=json.loads((out/"manifest.json").read_text())
          assert m["issue"]==24 and m["stage"]=="FA_L2_ONLY"
          assert m["separate_surface_art"] and m["same_flask_motif"]
          assert m["room_source"]=="assets/art/to001/toxicology_room_icon.svg"
          assert m["floor_source"]=="assets/art/to001/toxicology_floor_glyph.svg"
          assert m["native_room_size"]==[64,64] and m["vanilla_floor_cell"]==[256,128]
          assert m["native_floor_bbox"]==[61,11,196,121]
          assert m["private_floor_bbox"]==[31,6,98,61]
          assert m["ts_private_atlas"]==[2048,2048] and m["ts_grid"]==[16,32]
          assert m["tile_376_rect"]==[1024,1472,1152,1536]
          assert m["no_baked_room_color"] and m["no_native_game_asset_copy"]
          assert m["non_installable"] and not any(m[k] for k in ["game_L3","game_L4","owner_visual_approved"])
          with Image.open(out/"toxicology_floor_glyph_256x128.png") as native, \
               Image.open(out/"toxicology_floor_glyph_128x64.png") as private, \
               Image.open(out/"toxicology_floor_atlas_private_376.png") as atlas:
              native=native.convert("RGBA");private=private.convert("RGBA");atlas=atlas.convert("RGBA")
              assert native.size==(256,128) and private.size==(128,64) and atlas.size==(2048,2048)
              assert atlas.crop((1024,1472,1152,1536)).tobytes()==private.tobytes()
              alpha=atlas.getchannel("A")
              ImageDraw.Draw(alpha).rectangle((1024,1472,1151,1535),fill=0)
              assert alpha.getbbox() is None
              assert len({a for a in private.getchannel("A").getdata() if 0<a<255})>=16
          for name,digest in m["source_sha256"].items():
              assert hashlib.sha256((Path("assets/art/to001")/name).read_bytes()).hexdigest()==digest
          for name,digest in m["sha256"].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest
          assert not list(out.rglob("*.dll")) and not list(out.rglob("*.aes"))
          print("PASS FA L2: independent 256x128 floor art, 128x64 private atlas, no original game pixels")
          print("No game L3, L4, installation, aesthetic acceptance or release")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ABCL-TO001-NATIVE-FLOOR-ART-L2-NONINSTALLABLE
          path: ${{ runner.temp }}/TO001-floor/
          retention-days: 7
          if-no-files-found: error
