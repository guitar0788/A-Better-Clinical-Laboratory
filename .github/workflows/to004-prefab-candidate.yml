name: TO-004 prefab source-only candidate

on:
  pull_request:
    paths:
      - 'assets/to004/**'
      - '.github/workflows/to004-prefab-candidate.yml'

permissions:
  contents: read

jobs:
  to004-source:
    name: TO-004 native prefab L2 + artifact (not game L4)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/to004-toxicology-prefabs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head (not a moving branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Validated exact commit: $EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-test image validator only
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Verify TO-004 owner originals, tags, native asset paths and thumbnails
        run: python -m unittest discover -s assets/to004/tests -p 'test_*.py' -v
      - name: Verify guarded overlay packaging and source SHA rejection
        run: python -m unittest discover -s assets/to004/tools -p 'test_*.py' -v
      - name: Package only additive prefab resources and guarded install scripts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python assets/to004/tools/package_to004.py --source-sha "$EXPECTED_SHA" --output dist/ABCL_TO004_TestOnly_Overlay.zip | tee dist/TO004_PACKAGE_SUMMARY.txt
          sha256sum dist/ABCL_TO004_TestOnly_Overlay.zip | tee dist/TO004_SHA256.txt
          echo 'This is NOT an installed game test or Alpha build.'
      - name: Publish source-matched TO-004 additive test-only overlay
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-TO004-Prefab-Overlay-TestOnly
          path: dist/
          if-no-files-found: error
          retention-days: 14