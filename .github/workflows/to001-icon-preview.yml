name: TO-001 Original Toxicology Room Icon (FA Review Only)

on:
  push:
    branches:
      - feature/art-001-two-devices
    paths:
      - "assets/art/to001/**"
      - "tools/build_to001_icon.py"
      - ".github/workflows/to001-icon-preview.yml"
  pull_request:
    paths:
      - "assets/art/to001/**"
      - "tools/build_to001_icon.py"
      - ".github/workflows/to001-icon-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-original-room-icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned smooth 2D art renderer
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.3.0"
      - name: Generate original LAB-red active and LAB-gray inactive icons
        run: |
          python tools/build_to001_icon.py \
            --svg assets/art/to001/toxicology_room_icon.svg \
            --inactive-svg assets/art/to001/toxicology_room_icon_inactive.svg \
            --output "$RUNNER_TEMP/TO001-FA-Review"
      - name: Verify native LAB palette, exact binary PNG sources, safe UI crop
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ["RUNNER_TEMP"])/"TO001-FA-Review"
          m=json.loads((root/"manifest.json").read_text())
          assert m["issue"]==24 and m["task"]=="TO-001"
          assert m["active_asset_id"]=="ASSET_ABCL_TOXICOLOGY_ROOM_ICON"
          assert m["inactive_candidate_asset_id"]=="ASSET_ABCL_TOXICOLOGY_ROOM_ICON_INACTIVE"
          assert m["intended_room_type"]=="ROOM_TYPE_ABCL_G1_TOXICOLOGY_LAB"
          assert m["format"]=="TEXTURE_CUSTOM_SPRITE"
          assert m["resolution"]==[64,64] and m["native_crop_rect"]==[2,2,60,60]
          assert m["native_active_panel"]=="#C93F3D" and m["native_inactive_panel"]=="#999999"
          assert m["native_glyph"]=="#F2F2F2"
          assert m["source_only"] and not m["owner_visual_approved"]
          assert not m["game_asset_registered"] and not m["native_room_ui_adapted"]
          assert not m["l3_tested"] and not m["l4_tested"]
          assert m["no_iconindex_850_override"] and m["no_global_zone_color_override"]
          assert not m["inactive_switching_proven"]
          pairs=[
              ("toxicology_room_icon.png",(201,63,61)),
              ("toxicology_room_icon_inactive.png",(153,153,153)),
          ]
          binary=[]
          for name,rgb in pairs:
              with Image.open(root/name) as art, Image.open(Path("assets/art/to001")/name) as committed:
                  a=art.convert("RGBA");b=committed.convert("RGBA")
                  assert a.size==(64,64) and a.mode=="RGBA"
                  assert a.getchannel("A").getbbox()==(2,2,62,62)
                  assert a.getpixel((11,11))==(*rgb,255), "wrong LAB category palette"
                  assert a.tobytes()==b.tobytes(), "committed source does not match SVG"
                  assert len({n for n in a.getchannel("A").getdata() if 0<n<255})>=10
                  binary.append(a.tobytes())
          assert binary[0]!=binary[1], "inactive and active artwork are indistinguishable"
          for name,digest in m["sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          assert not list(root.rglob("*.dll")) and not list(root.rglob("*.aes"))
          print("FA L2 PASS: 64px RED/GRAY 2-state original resource, exact source, crop")
          print("Real room-menu UI adapter, automatic disabled state and L3/L4 still unverified")
          PY
      - name: Upload source preview, NOT an installable mod
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-TO001-NATIVE-LAB-PALETTE-REVIEW-ONLY
          path: ${{ runner.temp }}/TO001-FA-Review/
          retention-days: 7
          if-no-files-found: error
      - name: Record scoped completion
        if: always()
        run: |
          echo "### TO-001 original laboratory category color correction" >> "$GITHUB_STEP_SUMMARY"
          echo "Active #C93F3D / inactive #999999; original white #F2F2F2 glyph; 2px crop." >> "$GITHUB_STEP_SUMMARY"
          echo "Review: to001_mobile_review.png; two true RGBA sprites and SHA manifest." >> "$GITHUB_STEP_SUMMARY"
          echo "**No original atlas or zoning-layer changes; no TS UI adapter, L3/L4 or owner visual approval.**" >> "$GITHUB_STEP_SUMMARY"
