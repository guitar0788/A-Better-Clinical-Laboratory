name: TO-001 Native Glyph Size and Native Background Isolation (FA L2)

on:
  push:
    branches: [feature/art-001-two-devices]
    paths: ["assets/art/to001/**", "tools/build_to001_icon.py", ".github/workflows/to001-icon-preview.yml"]
  pull_request:
    paths: ["assets/art/to001/**", "tools/build_to001_icon.py", ".github/workflows/to001-icon-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fa-room-icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated SVG rasterization tools
        run: python -m pip install --disable-pip-version-check "CairoSVG==2.8.2" "Pillow==12.3.0"
      - name: Regenerate two original transparent-white glyph resources
        run: |
          python tools/build_to001_icon.py --svg assets/art/to001/toxicology_room_icon.svg --inactive-svg assets/art/to001/toxicology_room_icon_inactive.svg --output "$RUNNER_TEMP/TO001-FA-Review"
      - name: Validate original-size design contract and committed PNG pixels
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from PIL import Image
          r=Path(os.environ["RUNNER_TEMP"])/"TO001-FA-Review"
          m=json.loads((r/"manifest.json").read_text())
          assert m["issue"]==24 and m["task"]=="TO-001"
          assert m["native_cell"]==[64,64] and m["native_crop"]==[2,2,60,60]
          assert m["measured_glyph_bbox"]==[19,16,45,48]
          assert m["vanilla_reference_glyph_bboxes"]=={
              "hematology_850":[20,14,44,49],
              "microbiology_2868":[14,16,50,47],
              "histology_854":[16,15,48,48]}
          assert m["foreground_color"]=="#F2F2F2"
          assert m["pixel_content"]=="white_glyph_only_on_transparent_canvas"
          assert m["room_type"]=="ROOM_TYPE_ABCL_G1_TOXICOLOGY_LAB"
          assert m["active_asset_id"]=="ASSET_ABCL_TOXICOLOGY_ROOM_ICON"
          assert m["inactive_candidate_asset_id"]=="ASSET_ABCL_TOXICOLOGY_ROOM_ICON_INACTIVE"
          assert m["active_and_inactive_glyph_pixels_equal"]
          assert m["isolate_native_background"] and m["ts_must_verify_background_compositing"]
          assert m["no_global_atlas_edits"] and m["no_g1_changes"]
          assert not m["ui_L4_pass"] and not m["owner_visual_acceptance"]
          assert not m["game_asset_registered_by_this_stage"]
          pixels=[]
          for name in ["toxicology_room_icon.png", "toxicology_room_icon_inactive.png"]:
              with Image.open(r/name) as a, Image.open(Path("assets/art/to001")/name) as b:
                  a=a.convert("RGBA"); b=b.convert("RGBA")
                  assert a.size==(64,64) and a.tobytes()==b.tobytes()
                  assert a.getpixel((10,10))[3]==0 and a.getpixel((54,54))[3]==0
                  assert len({p for p in a.getchannel("A").getdata() if 0<p<255})>=14
                  pixels.append(a.tobytes())
          assert pixels[0]==pixels[1]
          for name,sha in m["sha256"].items():
              assert hashlib.sha256((r/name).read_bytes()).hexdigest()==sha
          assert not list(r.rglob("*.dll")) and not list(r.rglob("*.aes"))
          print("PASS: real 26x32 glyph, 64px RGBA, no baked LAB/zone color")
          print("L4 still FAILED until TS confirms both UI surfaces in game")
          PY
      - name: Upload source-only icon review; no installer
        uses: actions/upload-artifact@v4
        with:
          name: ABCL-TO001-NATIVE-SIZE-TRANSPARENT-GLYPH-REVIEW
          path: ${{ runner.temp }}/TO001-FA-Review/
          retention-days: 7
          if-no-files-found: error
      - name: Record native UI integration boundary
        if: always()
        run: |
          echo "### TO-001 FA native visible-size fix" >> "$GITHUB_STEP_SUMMARY"
          echo "Vanilla foreground bboxes HEM 24x35, MIC 36x31, HIST 32x33; Toxicology 26x32." >> "$GITHUB_STEP_SUMMARY"
          echo "Actual active/disabled icon PNGs are transparent WHITE foreground only; red/gray are preview-only simulated UI backdrops." >> "$GITHUB_STEP_SUMMARY"
          echo "**TS must verify native background compositing on room list + zoning, and run L3/L4 after repackaging.**" >> "$GITHUB_STEP_SUMMARY"
