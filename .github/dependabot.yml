version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    # Create one reviewable PR for the scheduled Actions dependency batch.
    # Group only compatible minor/patch updates; major updates stay separate.
    # No Dependabot PR may bypass Verify or the manual security/CI review gate.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow one grouped PR alongside an independently reviewed major update.
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
