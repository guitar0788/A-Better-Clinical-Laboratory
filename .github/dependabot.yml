version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    # Create one reviewable PR for the scheduled Actions dependency batch.
    # Major bumps still require individual compatibility and CI review;
    # Dependabot does not merge or publish anything.
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
